name: Build Emby Plugin

on:
  # 允许手动触发
  workflow_dispatch:
  # # 在推送到 main 分支时触发
  # push:
  #   branches: [ "main" ]
  # # 在创建 Pull Request 时触发
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # 确保与项目文件中的 TargetFramework 匹配

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build --no-restore --configuration Release

    # 添加一个步骤来检查编译输出目录，方便调试
    - name: List build output (after build)
      run: find . -name "*.dll" -type f -path "./**/bin/Release/net8.0/*" -ls

    # --- 关键步骤：创建包含所有 DLL 的 ZIP ---
    - name: Create ZIP with all DLLs
      run: |
        # 切换到输出目录
        cd ./bin/Release/net8.0/
        # 创建一个包含所有 DLL 文件的 ZIP，并且 ZIP 根目录就是 DLL 文件
        # zip -j 将所有文件直接放入 ZIP 根目录，不保留路径
        zip -j ../EmbyPinyinPlugin-${{ github.sha }}.zip *.dll
        # 验证 ZIP 内容
        echo "Contents of the created ZIP:"
        unzip -l ../EmbyPinyinPlugin-${{ github.sha }}.zip
        # 切换回工作目录
        cd -

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EmbyPinyinPlugin-${{ github.sha }} # 生成的文件名包含提交 SHA
        # 上传我们刚刚创建的包含所有 DLL 的 ZIP 文件
        path: ./bin/Release/net8.0/EmbyPinyinPlugin-${{ github.sha }}.zip
        if-no-files-found: error # 如果没找到文件，工作流失败
        retention-days: 30 # 保留 30 天

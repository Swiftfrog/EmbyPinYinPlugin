name: Build Emby Plugin

on:
  # 允许手动触发
  workflow_dispatch:
  # # 在推送到 main 分支时触发
  # push:
  #   branches: [ "main" ]
  # # 在创建 Pull Request 时触发
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:
    # 关键：使用 windows-latest
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # 确保与项目文件中的 TargetFramework 匹配

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build --no-restore --configuration Release

    # 添加一个步骤来检查编译输出目录，方便调试
    - name: List build output (after ILRepack)
      run: |
        Get-ChildItem -Path "./bin/Release/net8.0/" -Filter "EmbyPinyinPlugin.dll" -Recurse | ForEach-Object { 
          Write-Output $_.FullName
          Write-Output "Size: $($_.Length) bytes"
        }

    # --- 创建仅包含主 DLL 的 ZIP (现在这个 DLL 已经包含了 TinyPinyin) ---
    - name: Create ZIP with main DLL only
      run: |
        $zipFileName = "EmbyPinyinPlugin-${{ github.sha }}.zip"
        $outputDir = "./bin/Release/net8.0/"
        $dllPath = "$outputDir/EmbyPinyinPlugin.dll"
        $zipPath = "$outputDir/$zipFileName"
        
        # 确保 DLL 存在
        if (-not (Test-Path $dllPath)) {
            Write-Error "DLL file not found: $dllPath"
            exit 1
        }
        
        # 创建 ZIP
        Compress-Archive -Path $dllPath -DestinationPath $zipPath -Force
        Write-Output "Created ZIP: $zipPath"
        
        # 验证 ZIP 内容
        Write-Output "Contents of the created ZIP:"
        $tempDir = "$outputDir/temp_zip_contents/"
        New-Item -ItemType Directory -Path $tempDir -Force
        Expand-Archive -Path $zipPath -DestinationPath $tempDir
        Get-ChildItem -Path $tempDir -Recurse
        Remove-Item -Path $tempDir -Recurse -Force # 清理临时目录

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EmbyPinyinPlugin-${{ github.sha }} # 生成的文件名包含提交 SHA
        # 上传我们刚刚创建的包含主 DLL 的 ZIP 文件 (该 DLL 已合并 TinyPinyin)
        # 使用与 PowerShell 脚本中完全相同的路径构建方式
        path: ./bin/Release/net8.0/EmbyPinyinPlugin-${{ github.sha }}.zip
        if-no-files-found: error # 如果没找到文件，工作流失败
        retention-days: 30 # 保留 30 天
